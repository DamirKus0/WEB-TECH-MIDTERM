<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete the demo micro-loan application form.">
  <title>Loan Application Form | Micro-Loan Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container-fluid header-inner">
      <a class="brand" href="index.html">Micro-Loan Platform</a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="apply.html" aria-current="page">Apply for Loan</a></li>
          <li><a href="loans.html">My Loans</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container application-page">
    <h1 class="fs-3">Loan Application Form</h1>
    <form action="success.html" method="get">
      <div class="card p-3 mb-3">
        <fieldset class="border-0 p-0 m-0">
          <legend class="float-none w-auto fs-5 mb-3">Personal Details</legend>
          <div class="row">
            <div class="col-12 mb-3">
              <label class="form-label" for="full-name">Full Name</label>
              <input class="form-control" id="full-name" name="full-name" type="text" autocomplete="name" required>
            </div>
            <div class="col-12 mb-3">
              <label class="form-label" for="email">Email Address</label>
              <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="phone">Phone Number</label>
              <input class="form-control" id="phone" name="phone" type="tel" autocomplete="tel" required>
            </div>
          </div>
        </fieldset>
      </div>

      <div class="card p-3 mb-3">
        <fieldset class="border-0 p-0 m-0">
          <legend class="float-none w-auto fs-5 mb-3">Financial Information</legend>
          <div class="row">
            <div class="col-12 mb-3">
              <label class="form-label" for="income">Monthly Income ($)</label>
              <input class="form-control" id="income" name="income" type="number" min="0" step="0.01" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="employment">Employment Status</label>
              <select class="form-select" id="employment" name="employment" required>
                <option value="employed">Employed</option>
                <option value="self-employed">Self-Employed</option>
                <option value="student">Student</option>
                <option value="unemployed">Unemployed</option>
              </select>
            </div>
          </div>
        </fieldset>
      </div>

      <div class="card p-3 mb-3">
        <fieldset class="border-0 p-0 m-0">
          <legend class="float-none w-auto fs-5 mb-3">Loan Details</legend>
          <div class="row">
            <div class="col-12 mb-3">
              <label class="form-label" for="desired-amount">Desired Loan Amount ($)</label>
              <input class="form-control" id="desired-amount" name="desired-amount" type="number" min="100" max="5000" step="0.01" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="purpose">Purpose of Loan</label>
              <textarea class="form-control" id="purpose" name="purpose" rows="3" minlength="10" maxlength="300" required></textarea>
            </div>
          </div>
        </fieldset>
      </div>
      <button class="btn btn-primary px-3 py-2" type="submit">Submit Application</button>
    </form>
  </main>

  <footer class="site-footer text-center">
    <p class="mb-1">© 2026 Micro-Loan Platform. All rights reserved.</p>
    <nav aria-label="Legal navigation">
      <a href="loan-details.html#privacy">Privacy Policy</a>
      <span aria-hidden="true"> | </span>
      <a href="loan-details.html#terms">Terms of Service</a>
    </nav>
  </footer>
</body>
</html>
